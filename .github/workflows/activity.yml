name: Update Activity Monitor

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          node scripts/generate_activity.js

      - name: Commit generated SVG
        run: |
          git config user.name "lyco-sh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/activity.svg

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update activity monitor"
          git push
